# Render blueprint for the Tachyon backend.
#
# Render runs this as a long-lived container, which is what the serving layer
# needs: the batch queue, the semantic cache and the circuit breaker all live in
# one process's memory, and none of them survive a serverless invocation.
#
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo.
# If Render rejects a key here, create the service through the UI instead and
# copy these settings across; blueprint schema changes occasionally.
services:
  - type: web
    name: tachyon-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free # 512 MB RAM; sleeps after ~15 min idle
    region: singapore # closest to India; oregon / frankfurt also available
    healthCheckPath: /readyz # 503 while the model loads, 200 once serving
    dockerBuildArgs:
      WITH_MODELS: "true" # bake the embedder weights into the image
      PREFETCH_HF_MODEL: "false" # skip DistilBERT: the demo uses the stub
      EMBEDDER_DTYPE: fp32 # "q8" if 512 MB turns out to be tight
    envVars:
      - key: EMBEDDER
        value: minilm # real semantic embeddings
      - key: MODEL_BACKEND
        value: stub # the simulated accelerator the benchmarks use
      - key: CACHE_THRESHOLD
        value: "0.92"
      - key: CORS_ORIGINS
        # "*" so Vercel preview deployments work too. Pin this to your real
        # domain once anything behind the API costs money.
        value: "*"
      - key: ADMIN_TOKEN
        # Empty keeps /v1/admin/* open, which is what makes the live demo
        # interactive. Set a value to lock the controls.
        value: ""
      - key: LOG_INPUTS
        value: "true"
